name: Feature request
description: Suggest a change or an addition to this repository.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind. An API shape or example is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
